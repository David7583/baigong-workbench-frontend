<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local AI Workbench · Studio</title><link rel="stylesheet" href="/workspace/studio_v0001.css"><link rel="stylesheet" href="/workspace/studio_operations_v0001.css"><link rel="stylesheet" href="/workspace/capability_workspace_v0001.css"><link rel="stylesheet" href="/workspace/studio_themes_v0001.css"><link rel="stylesheet" href="/workspace/studio_cloud_v0001.css"><link rel="stylesheet" href="/workspace/desktop_workspace_v0001.css"><link rel="stylesheet" href="/workspace/platform_design_v0001.css"><link rel="stylesheet" href="/workspace/styles/integration_catalog_v0001.css">
<style>.development-origin{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:4px 10px;font-size:12px;border-bottom:1px solid var(--line,#ddd);flex-shrink:0}</style><link rel="stylesheet" href="/workspace/categories/tasks_v0002.css">
<link rel="stylesheet" href="/workspace/studio_loading_v0001.css"><link rel="stylesheet" href="/workspace/database_groups_v0001.css">
</head><body><div id="studio" class="desktop-workspace">
<header class="titlebar"><div class="brand"><span class="brand-glyph">W<span>·</span></span><span class="brand-name">本地工作台<small>LOCAL WORKBENCH</small></span></div><div class="title-center"><span class="tiny-dot"></span><span data-current-project>未选择项目</span> <span class="title-slash">/</span> Studio</div><div class="title-actions"><button id="backend-overview">后端总览</button><button id="knowledge-cloud">知识空间</button><button id="runtime-center">运行中心</button><button id="restore-tools">恢复工具</button><button id="focus-workspace" title="隐藏所有面板，让当前工具铺满工作区">专注模式</button><button id="view-menu" title="调整布局">◫ <span>视图</span></button><button id="add-category" title="添加独立栏目">＋ <span>栏目</span></button><button id="empty-studio" title="只解除加载工作台中的接入，不删除功能和数据">全部解除加载</button><button id="legacy-open">兼容视图 ↗</button></div></header>
<nav id="category-menu" class="menubar" aria-label="顶部栏目"></nav>
<div class="contextbar"><div class="crumb"><span id="crumb-icon">◇</span><span id="crumb-category">工具</span><span class="crumb-separator">/</span><span id="crumb-view">资源库</span></div><div class="context-actions"><span class="status-pill"><span class="tiny-dot"></span>本地连接</span><button id="refresh-catalog" title="刷新目录">↻</button><button id="add-resource" class="filled">＋ 添加</button></div></div>
<aside id="studio-library"><div class="panel-heading"><span id="library-title">工具库</span><span class="panel-count" id="library-count">0</span><button data-hide-panel="left" class="panel-collapse" aria-label="隐藏栏目侧栏" title="隐藏栏目侧栏">‹</button></div><div class="library-search"><span>⌕</span><input id="library-search" placeholder="搜索当前栏目" aria-label="搜索当前栏目"></div><div class="library-label"><span>我的资源</span><button id="scan-category">扫描 ↗</button></div><div id="library-list"></div><div class="library-foot"><span class="tiny-dot"></span><span>各栏目独立管理</span></div></aside>
<div class="splitter split-left" data-split="left" role="separator" aria-label="调整栏目宽度" tabindex="0"></div>
<main id="studio-main"><div id="studio-tabs" role="tablist"></div><div id="studio-content"></div></main>
<div class="splitter split-right" data-split="right" role="separator" aria-label="调整检查面板宽度" tabindex="0"></div>
<aside id="studio-inspector"><div class="panel-heading"><span>资源检查</span><button data-hide-panel="right" class="panel-collapse" aria-label="隐藏检查面板" title="隐藏检查面板">›</button></div><div id="inspect-content"></div><div class="appearance"><span class="section-caption">显示设置</span><label>卡片大小 <input type="range" min="180" max="400" value="250" id="card-size" aria-label="卡片大小"></label><label>顶部栏高度 <input type="range" min="42" max="100" value="58" id="header-size" aria-label="顶部栏高度"></label><button id="reset-studio-layout">重置面板尺寸</button></div></aside>
<div class="splitter split-bottom" data-split="bottom" role="separator" aria-label="调整活动面板高度" tabindex="0"></div>
<section id="studio-bottom"><div class="activity-heading"><span>≋ &nbsp;活动记录</span><span class="activity-meta">仅记录实际操作</span><button data-hide-panel="bottom" class="panel-collapse" aria-label="隐藏活动记录" title="隐藏活动记录">⌄</button><button id="clear-activity">清空显示</button></div><div id="activity-list"><div class="activity-empty">工作台已就绪，等待你的操作。</div></div></section>
<footer class="statusbar"><span id="connection-state"><span class="tiny-dot"></span>正在连接本地后端</span><span id="resource-total">—</span><span class="status-right">莫兰迪 · 可调整布局 &nbsp; | &nbsp; Studio 0.7</span></footer></div>
<div id="layout-menu" class="popover" hidden><strong>工作区布局</strong><label><input type="checkbox" data-panel="left">显示栏目侧栏</label><label><input type="checkbox" data-panel="right">显示检查面板</label><label><input type="checkbox" data-panel="bottom">显示活动记录</label><button id="reset-menu-layout">恢复默认布局</button></div>
<dialog id="studio-dialog"><div class="dialog-heading"><div><span class="section-caption" id="dialog-eyebrow">添加资源</span><h2 id="dialog-title">添加</h2></div><button id="dialog-close" aria-label="关闭">×</button></div><form id="studio-form"><div id="dialog-fields"></div><p id="dialog-error" role="alert"></p><div class="dialog-buttons"><button type="button" id="dialog-cancel">取消</button><button type="submit" class="filled" id="dialog-submit">添加到工作台</button></div></form></dialog>
<div id="studio-toast" role="status" hidden></div><link rel="stylesheet" href="/workspace/studio_timeline_v0001.css"><script type="module" src="/workspace/studio_shell_v0022.mjs"></script></body></html>
